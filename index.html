<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROEXAM BE - PPL & ULM Examensimulator</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 24px; color: var(--primary); margin-bottom: 5px; text-align: center; }
        h2 { font-size: 16px; color: #64748b; font-weight: normal; margin-top: 0; margin-bottom: 25px; text-align: center; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
        .meta-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .question-box { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .option-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-item:hover { background-color: #f1f5f9; }
        .option-item.selected { border-color: var(--primary); background-color: #eff6ff; }
        .option-item.correct { border-color: var(--success); background-color: #dcfce7; color: var(--success); font-weight: 600; }
        .option-item.wrong { border-color: var(--error); background-color: #fee2e2; color: var(--error); }
        .option-item input { margin-right: 12px; pointer-events: none; }
        .explanation-box {
            background-color: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 6px 6px 0;
            display: none;
        }
        .nav-buttons { display: flex; gap: 10px; }
        .nav-buttons button { flex: 1; }
        .secondary-btn { background-color: #64748b; }
        .secondary-btn:hover { background-color: #475569; }
        .result-screen { text-align: center; }
        .score-big { font-size: 48px; font-weight: 800; margin: 20px 0; }
        .pass { color: var(--success); }
        .fail { color: var(--error); }
        .loading { text-align: center; font-style: italic; color: #64748b; padding: 40px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>AEROEXAM BE</h1>
    <h2>PPL (EASA) & ULM (DGLV) Examensimulator</h2>

    <!-- SCHERM 1: INITIALISATIE -->
    <div id="setup-screen" class="section active">
        <div class="form-group">
            <label for="api-key">Google Gemini API Key</label>
            <input type="text" id="api-key" placeholder="Plak je AI Studio API Key hier...">
            <small style="display:block; margin-top:5px; color:#64748b;">
                Sleutel nodig? Haal er gratis een via <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a>.
            </small>
        </div>
        <div class="form-group">
            <label for="exam-type">Examentype</label>
            <select id="exam-type" onchange="updateSubjects()">
                <option value="PPL">PPL (EASA - 9 Vakken)</option>
                <option value="ULM">ULM (DGLV - 4 Vakken)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="subject">Vakgebied</label>
            <select id="subject"></select>
        </div>
        <button onclick="startExam()">Valideer & Start</button>
    </div>

    <!-- SCHERM 2: SIMULATOR INTERFACE -->
    <div id="exam-screen" class="section">
        <div class="meta-bar">
            <span id="meta-info">PPL - Luchtvaartrecht</span>
            <span id="meta-progress">Vraag 1 / 20</span>
            <span id="meta-timer">Resterende Tijd: 40:00</span>
        </div>

        <div id="loading-indicator" class="loading">
            De vraag wordt gegenereerd met Gemini Flash op basis van EASA/DGLV normen en de Bas Vrijhof VFR theorie...
        </div>

        <div id="question-content" style="display: none;">
            <div id="question-text" class="question-box"></div>
            <div id="options-container" class="options-list"></div>
            <div id="explanation-text" class="explanation-box"></div>

            <div class="nav-buttons">
                <button id="btn-prev" class="secondary-btn" onclick="prevQuestion()">Vorige</button>
                <button id="btn-check" onclick="checkAnswer()">Controleer Antwoord</button>
                <button id="btn-next" onclick="nextQuestion()">Volgende Vraag</button>
            </div>
        </div>
    </div>

    <!-- SCHERM 3: SUMMARY FINISH -->
    <div id="result-screen" class="section result-screen">
        <h2>Examen Beëindigd</h2>
        <div id="score-display" class="score-big">0%</div>
        <p id="result-status" style="font-weight: bold; font-size: 18px;"></p>
        <p id="score-details"></p>
        <button onclick="resetSimulator()" style="margin-top:20px;">Hoofdmenu / Herkans Examen</button>
    </div>
</div>

<script>
    let apiKey = "";
    let examType = "";
    let currentSubject = "";
    let currentQuestionIndex = 0;
    const totalQuestions = 20;
    let timerInterval = null;
    let timeLeft = 2400; 
    let questionsData = []; 

    const subjectsMap = {
        PPL: ["Luchtvaartrecht", "Algemene Kennis van het Luchtvaartuig", "Vluchtprestaties en Vluchtplanning", "Menselijke Prestaties en Beperkingen", "Meteorologie", "Navigatie", "Operationele Procedures", "Beginselen van het Vliegen", "Communicatie"],
        ULM: ["Reglementering", "Aerodynamica en Techniek", "Meteorologie", "Navigatie en Veiligheid"]
    };

    function updateSubjects() {
        const type = document.getElementById("exam-type").value;
        const subjectSelect = document.getElementById("subject");
        subjectSelect.innerHTML = "";
        subjectsMap[type].forEach(sub => {
            const opt = document.createElement("option");
            opt.value = sub;
            opt.textContent = sub;
            subjectSelect.appendChild(opt);
        });
    }

    function startExam() {
        const keyInput = document.getElementById("api-key").value.trim();
        if (!keyInput) {
            alert("Voer een geldige Gemini API Key in.");
            return;
        }
        apiKey = keyInput;
        examType = document.getElementById("exam-type").value;
        currentSubject = document.getElementById("subject").value;
        
        document.getElementById("meta-info").textContent = `${examType} - ${currentSubject}`;
        
        switchScreen("exam-screen");
        
        currentQuestionIndex = 0;
        questionsData = [];
        
        timeLeft = 2400;
        startTimer();
        fetchQuestion();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishExam();
                return;
            }
            timeLeft--;
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById("meta-timer").textContent = `Resterende Tijd: ${mins}:${secs}`;
        }, 1000);
    }

    async function fetchQuestion() {
        document.getElementById("question-content").style.display = "none";
        document.getElementById("loading-indicator").style.display = "block";
        document.getElementById("explanation-text").style.display = "none";

        document.getElementById("meta-progress").textContent = `Vraag ${currentQuestionIndex + 1} / ${totalQuestions}`;
        document.getElementById("btn-prev").disabled = (currentQuestionIndex === 0);

        if (questionsData[currentQuestionIndex]) {
            renderQuestion(questionsData[currentQuestionIndex]);
            return;
        }

        const model = "gemini-3.8-flash"; 
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

        const promptText = `Je bent een officiële examinator voor Belgische Luchtvaart Examens. 
        Genereer exact één unieke meervoudige keuzevraag (MCQ) voor het ${examType} theorie-examen, vakgebied: ${currentSubject}. 
        Gebruik uitsluitend de Bas Vrijhof VFR theorie en EASA SERA luchtvaartwetgeving conform Belgische richtlijnen. 
        Geef je antwoord verplicht in het Nederlands.`;

        const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        question: { type: "STRING" },
                        options: { 
                            type: "ARRAY", 
                            items: { type: "STRING" },
                            minItems: 4,
                            maxItems: 4
                        },
                        correctIndex: { type: "INTEGER" },
                        explanation: { type: "STRING" }
                    },
                    required: ["question", "options", "correctIndex", "explanation"]
                }
            }
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "API Error");
            }

            const data = await response.json();
            const rawJson = data.candidates.content.parts.text;
            const parsedQuestion = JSON.parse(rawJson);
            
            // Initialiseer extra parameters voor navigatie-state tracking
            parsedQuestion.userSelectedIndex = null;
            parsedQuestion.isChecked = false;
            
            questionsData[currentQuestionIndex] = parsedQuestion;
            renderQuestion(parsedQuestion);
        } catch (error) {
            console.error(error);
            alert("Fout bij het ophalen van de vraag: " + error.message + "\n\nControleer of je API-key klopt en je internetlocatie ondersteund is.");
            resetSimulator();
        }
    }

    function renderQuestion(qData) {
        document.getElementById("loading-indicator").style.display = "none";
        document.getElementById("question-content").style.display = "block";

        document.getElementById("question-text").textContent = qData.question;
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        qData.options.forEach((opt, idx) => {
            const div = document.createElement("div");
            div.className = "option-item";
            div.dataset.index = idx;
            div.innerHTML = `<input type="radio" name="options" id="opt-${idx}"> <label for="opt-${idx}">${opt}</label>`;
            
            if (!qData.isChecked) {
                div.onclick = () => selectOption(idx);
            }
            container.appendChild(div);
        });

        // Restore status als de vraag al beantwoord is in de geschiedenis
        if (qData.userSelectedIndex !== null) {
            selectOption(qData.userSelectedIndex);
        }

        if (qData.isChecked) {
            applyVisualFeedback(qData);
            document.getElementById("btn-check").style.display = "none";
            document.getElementById("btn-next").style.display = "block";
        } else {
            document.getElementById("btn-check").style.display = "block";
            document.getElementById("btn-next").style.display = "none";
        }
    }

    function selectOption(index) {
        const qData = questionsData[currentQuestionIndex];
        if (qData.isChecked) return;
        
        qData.userSelectedIndex = index;
        document.querySelectorAll(".option-item").forEach((el, idx) => {
            el.classList.toggle("selected", idx === index);
            el.querySelector("input").checked = (idx === index);
        });
    }

    function checkAnswer() {
        const qData = questionsData[currentQuestionIndex];
        if (qData.userSelectedIndex === null) {
            alert("Selecteer eerst een antwoord.");
            return;
        }
        
        qData.isChecked = true;
        applyVisualFeedback(qData);

        document.getElementById("btn-check").style.display = "none";
        document.getElementById("btn-next").style.display = "block";
    }

    function applyVisualFeedback(qData) {
        const items = document.querySelectorAll(".option-item");
        items.forEach((item, idx) => {
            if (idx === qData.correctIndex) {
                item.className = "option-item correct";
            } else if (idx === qData.userSelectedIndex) {
                item.className = "option-item wrong";
            } else {
                item.className = "option-item";
            }
        });

        const expBox = document.getElementById("explanation-text");
        expBox.textContent = `Theoretische Toelichting (Bas Vrijhof VFR): ${qData.explanation}`;
        expBox.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex >= totalQuestions) {
            finishExam();
        } else {
            fetchQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            fetchQuestion();
        }
    }

    function finishExam() {
        clearInterval(timerInterval);
        switchScreen("result-screen");
        
        let correctCount = 0;
        questionsData.forEach(q => {
            if (q && q.userSelectedIndex === q.correctIndex) {
                correctCount++;
            }
        });

        const finalPercentage = Math.round((correctCount / totalQuestions) * 100);
        const scoreDisplay = document.getElementById("score-display");
        const statusText = document.getElementById("result-status");
        
        scoreDisplay.textContent = `${finalPercentage}%`;
        document.getElementById("score-details").textContent = `Correct: ${correctCount} / ${totalQuestions} | Norm: 75%`;
        
        if (finalPercentage >= 75) {
            scoreDisplay.className = "score-big pass";
            statusText.textContent = "Gefeliciteerd! Geslaagd!";
            statusText.className = "pass";
        } else {
            scoreDisplay.className = "score-big fail";
            statusText.textContent = "Helaas. Niet geslaagd.";
            statusText.className = "fail";
        }
    }

    function resetSimulator() {
        clearInterval(timerInterval);
        switchScreen("setup-screen");
    }

    function switchScreen(screenId) {
        document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
        document.getElementById(screenId).classList.add("active");
    }

    updateSubjects();
</script>

</body>
</html>
